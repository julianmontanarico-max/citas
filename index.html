<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citas de Lei y Juli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap');

  :root{
    --sky-top: #FFD9A0;
    --sky-mid: #FFB4A8;
    --sky-low: #F09BB0;
    --sky-bottom: #C89BC9;
    --sun: #FFE7A8;
    --panel: #FFF8ED;
    --panel-light: #FFEFDA;
    --gold: #E8A93D;
    --gold-dim: #C4832A;
    --rose: #D9705F;
    --leaf: #7C9A5B;
    --text: #5B3A29;
    --text-muted: #9C7B62;
    --border: rgba(91,58,41,0.14);
    --shadow: 0 20px 46px rgba(150,80,60,0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% 8%, var(--sun) 0%, rgba(255,231,168,0) 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 32%, var(--sky-low) 62%, var(--sky-bottom) 100%);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  body{
    padding: clamp(16px, 4vw, 48px);
    padding-bottom: clamp(140px, 22vw, 220px);
    position: relative;
    overflow-x: hidden;
  }

  /* ---- sunset scene decorations ---- */
  .scene{
    position: fixed; inset:0; pointer-events:none; z-index:0;
  }
  .cloud{
    position:absolute; opacity:0.55;
    background: #FFF3E2;
    border-radius: 999px;
    filter: blur(0.5px);
  }
  .cloud::before, .cloud::after{
    content:''; position:absolute; background:inherit; border-radius:999px;
  }
  .c1{ width:140px; height:34px; top:8%; left:8%; }
  .c1::before{ width:70px; height:50px; top:-26px; left:14px; }
  .c1::after{ width:56px; height:38px; top:-18px; left:70px; }
  .c2{ width:110px; height:26px; top:15%; right:10%; opacity:0.4; }
  .c2::before{ width:56px; height:38px; top:-20px; left:12px; }

  /* Mountain silhouette in the distance */
  .mountains{
    position: fixed; left:0; right:0; bottom: clamp(120px, 19vw, 190px);
    height: clamp(120px, 20vw, 220px);
    z-index: 0; pointer-events:none;
  }
  .mountains svg{ width:100%; height:100%; display:block; }

  /* Green ground reaching the very bottom of the screen */
  .field-line{
    position: fixed; left:0; right:0; bottom:0; height: clamp(150px, 24vw, 260px);
    background:
      linear-gradient(180deg, rgba(124,154,91,0) 0%, rgba(108,140,74,0.55) 20%, rgba(84,114,54,0.92) 55%, #3F5B2C 100%);
    z-index: 0; pointer-events:none;
  }

  .sunflowers{
    position: fixed; bottom: 0; left:0; right:0; height: clamp(150px, 24vw, 260px);
    display:flex; justify-content:space-evenly; align-items:flex-end; flex-wrap:nowrap;
    padding: 0 clamp(4px,2vw,28px);
    z-index: 0; pointer-events:none;
    overflow: hidden;
  }
  .sunflowers svg{ width: auto; filter: drop-shadow(0 6px 8px rgba(70,40,20,0.15)); flex-shrink:0; }
  .sunflowers svg.sf-back{ height: 58%; opacity:0.6; }
  .sunflowers svg.sf-mid{ height: 78%; opacity:0.82; }
  .sunflowers svg.sf-front{ height: 100%; opacity:1; }

  .bee{
    position: fixed; z-index: 1; pointer-events:none;
    font-size: 20px;
    animation: bee-fly 18s ease-in-out infinite;
  }
  .bee.b2{ animation-duration: 23s; animation-delay: -6s; font-size: 16px; }
  .bee.b3{ animation-duration: 15s; animation-delay: -11s; font-size: 15px; }
  .bee.b4{ animation-duration: 20s; animation-delay: -3s; font-size: 14px; }
  .bee.b5{ animation-duration: 26s; animation-delay: -14s; font-size: 18px; }
  .bee.b6{ animation-duration: 17s; animation-delay: -9s; font-size: 13px; }

  @keyframes bee-fly{
    0%   { top: 22%; left: 6%;  transform: rotate(0deg); }
    20%  { top: 14%; left: 32%; transform: rotate(12deg); }
    40%  { top: 30%; left: 55%; transform: rotate(-10deg); }
    60%  { top: 12%; left: 74%; transform: rotate(8deg); }
    80%  { top: 26%; left: 90%; transform: rotate(-6deg); }
    100% { top: 22%; left: 6%;  transform: rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .bee{ animation: none; }
  }

  .wrap{
    position: relative; z-index: 2;
    max-width: 900px; margin: 0 auto;
  }

  /* Header */
  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .title-block h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size: clamp(28px, 4.5vw, 40px);
    margin: 0 0 4px 0; letter-spacing: -0.5px;
    color: #5B3A29;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  .title-block p{
    margin:0; color: var(--text-muted); font-size: 14px;
  }

  .btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size: 14px;
    border: none; border-radius: 999px; cursor: pointer;
    padding: 12px 22px;
    display:inline-flex; align-items:center; gap:8px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:focus-visible{ outline: 2px solid var(--gold-dim); outline-offset: 3px; }
  .btn-primary{
    background: linear-gradient(135deg, #FFD98A, var(--gold));
    color: #4A2E12;
    box-shadow: 0 8px 20px rgba(232,169,61,0.35);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 12px 26px rgba(232,169,61,0.45); }
  .btn-ghost{
    background: rgba(255,255,255,0.5); color: var(--text); border: 1px solid var(--border);
  }
  .btn-ghost:hover{ background: rgba(255,255,255,0.75); }
  .btn-danger{
    background: transparent; color: var(--rose); border: 1px solid rgba(217,112,95,0.4);
  }
  .btn-danger:hover{ background: rgba(217,112,95,0.12); }
  .btn-icon{
    width: 40px; height:40px; padding:0; border-radius:50%;
    background: var(--panel-light); color: var(--text); border: 1px solid var(--border);
    font-size: 18px; display:flex; align-items:center; justify-content:center;
  }
  .btn-icon:hover{ background: var(--panel); }

  .music-toggle{
    position: fixed; bottom: 20px; right: 20px; z-index: 40;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #FFD98A, var(--gold));
    color: #4A2E12; border: none; cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    box-shadow: 0 8px 20px rgba(232,169,61,0.4);
    transition: transform .15s ease;
  }
  .music-toggle:hover{ transform: scale(1.06); }
  .music-toggle.is-paused{ opacity: 0.75; }

  /* Next date banner */
  .next-banner{
    background: linear-gradient(120deg, rgba(255,248,237,0.9), rgba(255,239,218,0.85));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 22px;
    margin-bottom: 24px;
    display:flex; align-items:center; gap: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(2px);
  }
  .next-banner .thumb{
    width: 52px; height:52px; border-radius: 50%;
    background: var(--panel); flex-shrink:0;
    background-size: cover; background-position: center;
    border: 2px solid var(--gold);
  }
  .next-banner .info b{ font-family:'Fraunces', serif; font-size:17px; font-weight:600; }
  .next-banner .info div{ color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  .next-banner.empty{ color: var(--text-muted); font-style: italic; }

  /* Calendar */
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .cal-header .month{
    font-family:'Fraunces', serif; font-size: 22px; font-weight:600;
    min-width: 200px; text-align:center;
    text-transform: capitalize;
  }
  .cal-nav{ display:flex; gap:8px; align-items:center; }

  .calendar{
    background: rgba(255,248,237,0.88);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: clamp(10px, 2.5vw, 22px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(2px);
  }

  .dow-row{
    display:grid; grid-template-columns: repeat(7,1fr);
    margin-bottom: 8px;
  }
  .dow-row span{
    text-align:center; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
  }

  .days-grid{
    display:grid; grid-template-columns: repeat(7,1fr);
    gap: 6px;
  }

  .day{
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: rgba(91,58,41,0.035);
    border: 1px solid transparent;
    position: relative;
    cursor: pointer;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
    padding: 6px;
    overflow: hidden;
    transition: transform .12s ease, border-color .12s ease;
  }
  .day:hover{ transform: translateY(-2px); border-color: var(--border); }
  .day:focus-visible{ outline: 2px solid var(--gold-dim); outline-offset: 2px; }
  .day.empty{ visibility: hidden; cursor: default; }
  .day.today{ border-color: var(--gold-dim); }
  .day .num{
    font-size: 12px; color: var(--text-muted); font-weight:600;
    z-index: 2;
  }
  .day.has-cita .num{ color: var(--text); }
  .day .pin{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .day .pin img{
    width: 74%; height: 74%; object-fit: cover; border-radius: 50%;
    border: 2px solid var(--gold);
    transform: rotate(-4deg);
    box-shadow: 0 6px 14px rgba(80,40,20,0.35);
  }
  .day .pin .heart{
    width: 60%; height:60%; border-radius:50%;
    background: var(--panel-light);
    border: 2px dashed var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    font-size: 18px; color: var(--gold-dim);
  }
  .day.has-cita{ background: rgba(232,169,61,0.14); }

  /* Modal */
  .overlay{
    position: fixed; inset:0; background: rgba(90,55,40,0.35);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 50;
  }
  .modal{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    max-width: 460px; width: 100%;
    max-height: 88vh; overflow-y:auto;
    box-shadow: var(--shadow);
    position: relative;
  }
  .modal-close{
    position: absolute; top: 14px; right: 14px;
    z-index: 3;
  }

  /* Detail view - photo shown the same round way as on the calendar day */
  .detail-photo-wrap{
    display:flex; justify-content:center; padding: 28px 0 6px 0;
  }
  .detail-photo{
    width: 150px; height: 150px; object-fit: cover; border-radius: 50%;
    border: 3px solid var(--gold);
    transform: rotate(-3deg);
    box-shadow: 0 10px 22px rgba(80,40,20,0.35);
    display:block;
    background: var(--panel-light);
  }
  .detail-body{ padding: 24px; }
  .detail-body.no-photo{ padding-top: 30px; }
  .detail-body .date-chip{
    display:inline-block; font-size: 12px; color: var(--gold-dim);
    background: rgba(232,169,61,0.16);
    padding: 4px 12px; border-radius: 999px;
    margin-bottom: 10px; font-weight:600; letter-spacing:.3px;
  }
  .detail-body h2{
    font-family:'Fraunces', serif; font-weight: 600; font-size: 26px;
    margin: 0 0 12px 0;
  }
  .detail-body .quote{
    font-family:'Caveat', cursive; font-size: 26px; color: var(--text);
    line-height: 1.35; margin: 0 0 20px 0;
    border-left: 3px solid var(--gold-dim); padding-left: 14px;
  }
  .detail-actions{ display:flex; gap:10px; margin-top: 6px; }

  /* Form */
  .form-body{ padding: 26px; }
  .form-body h2{
    font-family:'Fraunces', serif; font-weight:600; font-size: 22px; margin: 0 0 18px 0;
  }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block; font-size: 12px; text-transform: uppercase; letter-spacing:.5px;
    color: var(--text-muted); margin-bottom: 6px; font-weight:600;
  }
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea{
    width: 100%; background: #FFFCF6; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 13px; font-family:'Work Sans', sans-serif; font-size: 14px;
  }
  .field textarea{ resize: vertical; min-height: 70px; font-family:'Caveat', cursive; font-size: 20px; }
  .field input:focus, .field textarea:focus{ outline: 2px solid var(--gold-dim); }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Photo uploader: preview matches the round "cuadro del día" shape */
  .photo-drop{
    border: none;
    border-radius: 0;
    padding: 6px;
    text-align:center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 10px;
    min-height: 130px;
  }
  .photo-drop .preview-circle{
    width: 108px; height: 108px; border-radius: 50%;
    background: var(--panel-light);
    border: 2px dashed var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    overflow: hidden;
    transform: rotate(-4deg);
    transition: border-color .15s ease;
  }
  .photo-drop.has-photo .preview-circle{
    border: 2px solid var(--gold);
    box-shadow: 0 6px 14px rgba(80,40,20,0.35);
  }
  .photo-drop .preview-circle img{
    width: 100%; height: 100%; object-fit: cover; display:block;
  }
  .photo-drop .preview-circle .hint-icon{
    font-size: 22px; color: var(--gold-dim); transform: rotate(4deg);
  }
  .photo-drop span{ background: transparent; color: var(--text-muted); padding: 0; border-radius: 0; }
  .photo-drop input{ display:none; }

  .form-actions{ display:flex; gap:10px; margin-top: 4px; }

  .empty-state{
    text-align:center; padding: 30px 10px; color: var(--text-muted);
  }
  .empty-state .big{ font-family:'Fraunces', serif; font-size: 20px; color: var(--text); margin-bottom:6px; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-light); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 999px; font-size: 13px;
    box-shadow: var(--shadow); z-index: 60;
    opacity: 0; pointer-events:none; transition: opacity .2s ease;
  }
  .toast.show{ opacity: 1; }

  .day-list{ display:flex; flex-direction:column; gap: 10px; }
  .day-list .mini{
    display:flex; align-items:center; gap: 12px;
    background: var(--panel-light); border-radius: 14px; padding: 10px 12px;
    cursor: pointer;
  }
  .day-list .mini img{ width: 42px; height:42px; border-radius:50%; object-fit:cover; border: 2px solid var(--gold); }
  .day-list .mini .ph{ width:42px; height:42px; border-radius:50%; background:#FFFCF6; display:flex; align-items:center; justify-content:center; color:var(--gold-dim); border: 2px dashed var(--gold-dim); }
  .day-list .mini b{ font-family:'Fraunces', serif; font-size: 14px; }

  @media (max-width: 520px){
    .two-col{ grid-template-columns: 1fr; }
    .day .num{ font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="bee">🐝</div>
  <div class="bee b2">🐝</div>
  <div class="bee b3">🐝</div>
  <div class="bee b4">🐝</div>
  <div class="bee b5">🐝</div>
  <div class="bee b6">🐝</div>
</div>

<div class="mountains">
  <svg viewBox="0 0 1000 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,220 0,140 110,60 210,150 320,40 430,150 520,90 640,160 760,70 880,150 1000,100 1000,220" fill="#B98BB0" opacity="0.55"/>
    <polygon points="0,220 0,170 150,110 300,175 460,95 620,175 800,120 1000,170 1000,220" fill="#A6749F" opacity="0.65"/>
  </svg>
</div>

<div class="field-line"></div>

<div class="sunflowers" id="sunflowerField"></div>

<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Citas de Lei y Juli jiji</h1>
      <p>Un calendario para cada momento que compartimos</p>
    </div>
    <button class="btn btn-primary" id="addBtn">+ Nueva cita</button>
  </header>

  <div class="next-banner" id="nextBanner">Cargando...</div>

  <div class="cal-header">
    <div class="cal-nav">
      <button class="btn-icon" id="prevMonth" aria-label="Mes anterior">‹</button>
    </div>
    <div class="month" id="monthLabel">—</div>
    <div class="cal-nav">
      <button class="btn-icon" id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <div class="calendar">
    <div class="dow-row">
      <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sa</span><span>Do</span>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<button class="music-toggle" id="musicToggle" type="button" aria-label="Reproducir o pausar la música" title="Música">🔇</button>

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDqQ-S869S49Wn1PcVhAYR0Givye1O4e4I",
    authDomain: "citas-be711.firebaseapp.com",
    databaseURL: "https://citas-be711-default-rtdb.firebaseio.com",
    projectId: "citas-be711",
    storageBucket: "citas-be711.firebasestorage.app",
    messagingSenderId: "866081734887",
    appId: "1:866081734887:web:ab7f825648bbb1b015a242",
    measurementId: "G-CQED74QLGG"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const citasRef = db.ref('citas');

  let citas = []; // {id, date:'YYYY-MM-DD', time, title, note, photo}
  let current = new Date();
  current.setDate(1);
  const todayStr = fmt(new Date());

  const daysGrid = document.getElementById('daysGrid');
  const monthLabel = document.getElementById('monthLabel');
  const nextBanner = document.getElementById('nextBanner');
  const modalRoot = document.getElementById('modalRoot');
  const toastEl = document.getElementById('toast');

  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function fmt(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  /* ---- Notificaciones (solo mientras la página está abierta) ---- */
  // Pide permiso apenas cargue la página, para poder avisar cuando
  // Lei (o tú) agreguen una cita desde otro dispositivo.
  if('Notification' in window && Notification.permission === 'default'){
    // Se pide en la primera interacción del usuario, ya que varios
    // navegadores bloquean el permiso si se pide antes de cualquier click.
    const askPermissionOnce = () => {
      Notification.requestPermission();
      window.removeEventListener('click', askPermissionOnce);
      window.removeEventListener('touchstart', askPermissionOnce);
    };
    window.addEventListener('click', askPermissionOnce);
    window.addEventListener('touchstart', askPermissionOnce);
  }

  let knownIds = null; // null = todavía no sabemos qué había antes
  let suppressNotifyUntil = 0; // evita notificarte a ti mismo justo al guardar

  function notifyNewCita(cita){
    const label = cita.title || 'Nueva cita';
    showToast('✨ Nueva cita: ' + label);
    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification('Nueva cita agregada 💛', {
          body: label + (cita.date ? ' · ' + cita.date : ''),
          icon: 'icon-192.png'
        });
      }catch(e){ /* algunos navegadores móviles no soportan new Notification() directo */ }
    }
  }

  /* ---- build a full sunflower field with three depth rows so it reaches the bottom edge ---- */
  function sunflowerSvg(cls, seedColor, petalColor, tilt){
    return `
      <svg class="${cls}" viewBox="0 0 60 130" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(${tilt}deg)">
        <line x1="30" y1="60" x2="30" y2="130" stroke="#5E7A40" stroke-width="4"/>
        <path d="M30 78 Q14 84 10 100" stroke="#5E7A40" stroke-width="3" fill="none"/>
        <ellipse cx="10" cy="104" rx="10" ry="5" fill="#6E8A4C" transform="rotate(-20 10 104)"/>
        <g fill="${petalColor}">
          <ellipse cx="30" cy="30" rx="7" ry="14"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(30 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(60 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(90 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(120 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(150 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(180 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(210 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(240 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(270 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(300 30 46)"/>
          <ellipse cx="30" cy="30" rx="7" ry="14" transform="rotate(330 30 46)"/>
        </g>
        <circle cx="30" cy="46" r="13" fill="${seedColor}"/>
      </svg>
    `;
  }

  function buildSunflowerField(){
    const field = document.getElementById('sunflowerField');
    if(!field) return;
    const layers = [
      { count: 11, cls: 'sf-back',  petal:'#EFA82E', seed:'#5C3B22' },
      { count: 9,  cls: 'sf-mid',   petal:'#F3B23C', seed:'#63402A' },
      { count: 7,  cls: 'sf-front', petal:'#FFCB55', seed:'#6B4226' }
    ];
    let html = '';
    layers.forEach(layer=>{
      for(let i=0;i<layer.count;i++){
        const tilt = (Math.random()*10 - 5).toFixed(1);
        html += sunflowerSvg(layer.cls, layer.seed, layer.petal, tilt);
      }
    });
    field.innerHTML = html;
  }
  buildSunflowerField();

  // Escucha en tiempo real: cualquier cambio en Firebase (de ti o de Lei)
  // actualiza citas y vuelve a dibujar el calendario automáticamente.
  citasRef.on('value', (snapshot) => {
    const data = snapshot.val();
    citas = data ? Object.values(data) : [];

    const currentIds = new Set(citas.map(c => c.id));
    if(knownIds === null){
      // Primera carga: solo guardamos el estado, sin notificar nada.
      knownIds = currentIds;
    } else {
      const isSuppressed = Date.now() < suppressNotifyUntil;
      citas.forEach(c => {
        if(!knownIds.has(c.id) && !isSuppressed){
          notifyNewCita(c);
        }
      });
      knownIds = currentIds;
    }

    render();
  }, (err) => {
    console.error(err);
    showToast('No se pudo conectar con la base de datos.');
  });

  // Ya no hace falta cargar manualmente: el listener de arriba dispara
  // el primer render en cuanto llegan los datos. Se deja como no-op
  // por si algo más del código la sigue llamando.
  async function loadCitas(){}

  async function saveCitas(){
    try{
      // Evita que te llegue una notificación de "nueva cita" por algo
      // que tú mismo/a acabas de guardar (dura unos segundos).
      suppressNotifyUntil = Date.now() + 4000;
      // Firebase guarda objetos por clave, así que convertimos el arreglo
      // en un objeto usando el id de cada cita como clave.
      const obj = {};
      citas.forEach(c => { obj[c.id] = c; });
      await citasRef.set(obj);
    }catch(e){
      console.error(e);
      showToast('Error guardando los datos.');
    }
  }

  function citasOn(dateStr){
    return citas.filter(c => c.date === dateStr);
  }

  function renderMonthLabel(){
    monthLabel.textContent = MESES[current.getMonth()] + ' ' + current.getFullYear();
  }

  function renderNextBanner(){
    const upcoming = citas
      .filter(c => c.date >= todayStr)
      .sort((a,b)=> a.date.localeCompare(b.date));
    if(upcoming.length === 0){
      nextBanner.className = 'next-banner empty';
      nextBanner.innerHTML = 'Aún no hay citas guardadas. Agrega la primera con el botón de arriba ✨';
      return;
    }
    const n = upcoming[0];
    const d = new Date(n.date + 'T00:00:00');
    const diffDays = Math.round((d - new Date(todayStr+'T00:00:00')) / 86400000);
    let when;
    if(diffDays === 0) when = 'Hoy';
    else if(diffDays === 1) when = 'Mañana';
    else when = 'En ' + diffDays + ' días';
    nextBanner.className = 'next-banner';
    nextBanner.innerHTML = `
      <div class="thumb" style="${n.photo ? `background-image:url('${n.photo}')` : `background:var(--panel-light)`}"></div>
      <div class="info">
        <b>${escapeHtml(n.title || 'Próxima cita')}</b>
        <div>${when} · ${d.toLocaleDateString('es-ES', {day:'numeric', month:'long'})}${n.time ? ' · ' + n.time : ''}</div>
      </div>
    `;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderGrid(){
    daysGrid.innerHTML = '';
    const year = current.getFullYear();
    const month = current.getMonth();
    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1; // Monday-first
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(year, month+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const empty = document.createElement('div');
      empty.className = 'day empty';
      daysGrid.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const dayCitas = citasOn(dateStr);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day' + (dayCitas.length ? ' has-cita' : '') + (dateStr===todayStr ? ' today' : '');
      cell.setAttribute('aria-label', d + ' de ' + MESES[month] + (dayCitas.length? ', tiene cita' : ''));
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      cell.appendChild(num);

      if(dayCitas.length){
        const pin = document.createElement('div');
        pin.className = 'pin';
        const first = dayCitas[0];
        if(first.photo){
          const img = document.createElement('img');
          img.src = first.photo;
          img.alt = '';
          pin.appendChild(img);
        } else {
          const h = document.createElement('div');
          h.className = 'heart';
          h.textContent = '♥';
          pin.appendChild(h);
        }
        cell.appendChild(pin);
      }

      cell.addEventListener('click', () => openDay(dateStr));
      daysGrid.appendChild(cell);
    }
  }

  function render(){
    renderMonthLabel();
    renderGrid();
    renderNextBanner();
  }

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    current.setMonth(current.getMonth()-1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    current.setMonth(current.getMonth()+1);
    render();
  });
  document.getElementById('addBtn').addEventListener('click', ()=> openForm(todayStr));

  function closeModal(){ modalRoot.innerHTML = ''; }

  function openDay(dateStr){
    const dayCitas = citasOn(dateStr);
    const d = new Date(dateStr+'T00:00:00');
    const label = d.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

    if(dayCitas.length === 0){
      openForm(dateStr);
      return;
    }
    if(dayCitas.length === 1){
      openDetail(dayCitas[0]);
      return;
    }
    modalRoot.innerHTML = `
      <div class="overlay" id="ov">
        <div class="modal">
          <button class="btn-icon modal-close" id="closeX">✕</button>
          <div class="form-body">
            <h2 style="text-transform:capitalize">${label}</h2>
            <div class="day-list" id="dayList"></div>
            <div class="form-actions" style="margin-top:16px;">
              <button class="btn btn-primary" id="addAnother">+ Agregar otra cita este día</button>
            </div>
          </div>
        </div>
      </div>
    `;
    const list = document.getElementById('dayList');
    dayCitas.forEach(c => {
      const row = document.createElement('div');
      row.className = 'mini';
      row.innerHTML = c.photo
        ? `<img src="${c.photo}" alt="">`
        : `<div class="ph">♥</div>`;
      const b = document.createElement('b');
      b.textContent = c.title || 'Sin título';
      row.appendChild(b);
      row.addEventListener('click', ()=> openDetail(c));
      list.appendChild(row);
    });
    document.getElementById('addAnother').addEventListener('click', ()=> openForm(dateStr));
    bindOverlayClose();
  }

  function openDetail(cita){
    const d = new Date(cita.date+'T00:00:00');
    const label = d.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    modalRoot.innerHTML = `
      <div class="overlay" id="ov">
        <div class="modal">
          <button class="btn-icon modal-close" id="closeX">✕</button>
          ${cita.photo ? `<div class="detail-photo-wrap"><img class="detail-photo" src="${cita.photo}" alt=""></div>` : ''}
          <div class="detail-body ${cita.photo ? '' : 'no-photo'}">
            <span class="date-chip" style="text-transform:capitalize">${label}${cita.time ? ' · ' + cita.time : ''}</span>
            <h2>${escapeHtml(cita.title || 'Nuestra cita')}</h2>
            ${cita.note ? `<p class="quote">"${escapeHtml(cita.note)}"</p>` : ''}
            <div class="detail-actions">
              <button class="btn btn-ghost" id="editBtn">Editar</button>
              <button class="btn btn-danger" id="delBtn">Eliminar</button>
            </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('editBtn').addEventListener('click', ()=> openForm(cita.date, cita));
    document.getElementById('delBtn').addEventListener('click', async ()=>{
      if(confirm('¿Eliminar esta cita?')){
        citas = citas.filter(c => c.id !== cita.id);
        await saveCitas();
        closeModal();
        render();
        showToast('Cita eliminada');
      }
    });
    bindOverlayClose();
  }

  function openForm(dateStr, existing){
    const isEdit = !!existing;
    const hasPhoto = !!(existing && existing.photo);
    modalRoot.innerHTML = `
      <div class="overlay" id="ov">
        <div class="modal">
          <button class="btn-icon modal-close" id="closeX">✕</button>
          <div class="form-body">
            <h2>${isEdit ? 'Editar cita' : 'Nueva cita'}</h2>
            <div class="field">
              <label for="fTitle">Título</label>
              <input type="text" id="fTitle" placeholder="Ej: Cena en nuestro lugar favorito" value="${existing ? escapeHtml(existing.title) : ''}">
            </div>
            <div class="two-col">
              <div class="field">
                <label for="fDate">Fecha</label>
                <input type="date" id="fDate" value="${existing ? existing.date : dateStr}">
              </div>
              <div class="field">
                <label for="fTime">Hora (opcional)</label>
                <input type="time" id="fTime" value="${existing && existing.time ? existing.time : ''}">
              </div>
            </div>
            <div class="field">
              <label for="fNote">Frase o nota bonita</label>
              <textarea id="fNote" placeholder="Escribe algo que quieras recordar de este momento...">${existing ? escapeHtml(existing.note) : ''}</textarea>
            </div>
            <div class="field">
              <label>Foto (opcional)</label>
              <label class="photo-drop ${hasPhoto ? 'has-photo' : ''}" id="photoDrop">
                <div class="preview-circle" id="previewCircle">
                  ${hasPhoto ? `<img src="${existing.photo}" alt="">` : `<span class="hint-icon">♥</span>`}
                </div>
                <span id="photoHint">${hasPhoto ? 'Cambiar foto' : 'Toca para subir una foto'}</span>
                <input type="file" accept="image/*" id="fPhoto">
              </label>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" id="saveBtn">Guardar</button>
              <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    `;

    let photoData = existing ? (existing.photo || '') : '';
    const photoInput = document.getElementById('fPhoto');
    const photoDrop = document.getElementById('photoDrop');
    const previewCircle = document.getElementById('previewCircle');
    const photoHint = document.getElementById('photoHint');
    photoInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        // downscale to keep storage small
        const img = new Image();
        img.onload = ()=>{
          const canvas = document.createElement('canvas');
          const maxSize = 700;
          let w = img.width, h = img.height;
          if(w > h && w > maxSize){ h = h*(maxSize/w); w = maxSize; }
          else if(h > maxSize){ w = w*(maxSize/h); h = maxSize; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          photoData = canvas.toDataURL('image/jpeg', 0.82);
          photoDrop.classList.add('has-photo');
          photoHint.textContent = 'Cambiar foto';
          previewCircle.innerHTML = `<img src="${photoData}" alt="">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      const title = document.getElementById('fTitle').value.trim();
      const date = document.getElementById('fDate').value;
      const time = document.getElementById('fTime').value;
      const note = document.getElementById('fNote').value.trim();
      if(!date){ showToast('Elige una fecha'); return; }
      if(!title){ showToast('Ponle un título a la cita'); return; }

      if(isEdit){
        const idx = citas.findIndex(c => c.id === existing.id);
        citas[idx] = { ...existing, title, date, time, note, photo: photoData };
      } else {
        citas.push({ id: 'c'+Date.now()+Math.random().toString(36).slice(2,7), title, date, time, note, photo: photoData });
      }
      await saveCitas();
      closeModal();
      current = new Date(date+'T00:00:00'); current.setDate(1);
      render();
      showToast(isEdit ? 'Cita actualizada' : 'Cita guardada ♥');
    });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    bindOverlayClose();
  }

  function bindOverlayClose(){
    document.getElementById('closeX').addEventListener('click', closeModal);
    document.getElementById('ov').addEventListener('click', (e)=>{
      if(e.target.id === 'ov') closeModal();
    });
    document.addEventListener('keydown', function esc(e){
      if(e.key === 'Escape'){ closeModal(); document.removeEventListener('keydown', esc); }
    });
  }

  loadCitas();

  /* ---- background music on loop while the page is open ---- */
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  if(bgMusic && musicToggle){
    bgMusic.volume = 0.55;

    const updateIcon = () => {
      musicToggle.textContent = bgMusic.paused ? '🔇' : '🔊';
      musicToggle.classList.toggle('is-paused', bgMusic.paused);
    };

    // Browsers block audio with sound from starting on its own; try anyway
    // (works if the site already has permission), then fall back to the button.
    bgMusic.play().then(updateIcon).catch(updateIcon);

    musicToggle.addEventListener('click', () => {
      if(bgMusic.paused){
        bgMusic.play().then(updateIcon).catch(()=>{});
      } else {
        bgMusic.pause();
        updateIcon();
      }
    });

    // Also start it on the very first click/tap/key anywhere on the page,
    // in case the browser allows it after any interaction.
    const startOnInteraction = () => {
      if(bgMusic.paused){
        bgMusic.play().then(updateIcon).catch(()=>{});
      }
      window.removeEventListener('click', startOnInteraction);
      window.removeEventListener('keydown', startOnInteraction);
      window.removeEventListener('touchstart', startOnInteraction);
    };
    window.addEventListener('click', startOnInteraction);
    window.addEventListener('keydown', startOnInteraction);
    window.addEventListener('touchstart', startOnInteraction);
  }
})();
</script>
</body>
</html>
